<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 440" width="100%" height="100%" 
     data-brand="Ford" data-model="Transit Custom / Tourneo" data-category="Ticari Van" 
     data-length-mm="4972" data-scale-factor="5.4043" data-angle="side_left">
  <defs>
    <!-- Zemin Gölgesi -->
    <radialGradient id="ground-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 3D Metalik Kaporta Işık Gradiyenti -->
    <linearGradient id="body-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Cam Yansıması -->
    <linearGradient id="glass-reflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    
    <!-- Jant Gradiyenti -->
    <radialGradient id="rim-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#a0a5aa"/>
      <stop offset="75%" stop-color="#40454a"/>
      <stop offset="100%" stop-color="#151719"/>
    </radialGradient>
  </defs>

  <!-- ================= 0. ZEMİN GÖLGESİ ================= -->
  <g id="layer-ground-shadow">
    <ellipse cx="500" cy="355" rx="440" ry="24" fill="url(#ground-shadow)" />
  </g>

  <!-- ================= 1. DİNAMİK KAPORTA BOYASI (RENK SEÇİCİ) ================= -->
  <!-- fill rengi JS ile dinamik olarak değiştirilir (örn: #ffffff, #1e293b, #dc2626, #2563eb vs.) -->
  <g id="layer-body-paint">
    <path id="vehicle-body-path" d="M 70 300 C 65 240, 85 190, 150 160 L 250 110 C 290 95, 340 90, 420 90 L 890 90 C 930 90, 940 100, 940 140 L 940 300 C 940 330, 930 335, 880 335 L 785 335 C 785 270, 715 270, 715 335 L 305 335 C 305 270, 235 270, 235 335 L 110 335 C 75 335, 70 325, 70 300 Z" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round" />
  </g>

  <!-- ================= 2. 3D KAPORTA IŞIK & GÖLGE KATMANI (METALLIC/GLOSS OVERLAY) ================= -->
  <g id="layer-body-lighting" style="pointer-events: none;">
    <path d="M 70 300 C 65 240, 85 190, 150 160 L 250 110 C 290 95, 340 90, 420 90 L 890 90 C 930 90, 940 100, 940 140 L 940 300 C 940 330, 930 335, 880 335 L 785 335 C 785 270, 715 270, 715 335 L 305 335 C 305 270, 235 270, 235 335 L 110 335 C 75 335, 70 325, 70 300 Z" fill="url(#body-highlight)" style="mix-blend-mode: overlay;" />
  </g>

  <!-- ================= 3. CAM VE 0-4 NUMARA CAM FİLMİ KATMANI ================= -->
  <g id="layer-windows">
    <!-- Standart Cam Tabanı -->
    <path d="M 165 165 L 255 118 C 285 105, 320 102, 380 102 L 530 102 C 540 102, 545 108, 545 120 L 545 180 C 545 188, 540 190, 530 190 L 175 190 C 160 190, 155 180, 165 165 Z M 560 102 L 730 102 C 740 102, 745 108, 745 120 L 745 180 C 745 188, 740 190, 730 190 L 560 190 Z M 760 102 L 915 102 C 925 102, 930 108, 930 120 L 930 180 C 930 188, 925 190, 915 190 L 760 190 Z" fill="#64748b" stroke="#0f172a" stroke-width="2" />
    
    <!-- Cam Yansıması -->
    <path d="M 165 165 L 255 118 C 285 105, 320 102, 380 102 L 530 102 C 540 102, 545 108, 545 120 L 545 180 C 545 188, 540 190, 530 190 L 175 190 C 160 190, 155 180, 165 165 Z M 560 102 L 730 102 C 740 102, 745 108, 745 120 L 745 180 C 745 188, 740 190, 730 190 L 560 190 Z M 760 102 L 915 102 C 925 102, 930 108, 930 120 L 930 180 C 930 188, 925 190, 915 190 L 760 190 Z" fill="url(#glass-reflection)" />
    
    <!-- DİNAMİK CAM FİLMİ KATMANI (0, 1, 2, 3, 4 Numara) -->
    <!-- Opacity JS ile ayarlanır: 0 No: 0.05, 1 No: 0.35, 2 No: 0.60, 3 No: 0.82, 4 No: 0.96 -->
    <path id="vehicle-window-tint" d="M 165 165 L 255 118 C 285 105, 320 102, 380 102 L 530 102 C 540 102, 545 108, 545 120 L 545 180 C 545 188, 540 190, 530 190 L 175 190 C 160 190, 155 180, 165 165 Z M 560 102 L 730 102 C 740 102, 745 108, 745 120 L 745 180 C 745 188, 740 190, 730 190 L 560 190 Z M 760 102 L 915 102 C 925 102, 930 108, 930 120 L 930 180 C 930 188, 925 190, 915 190 L 760 190 Z" fill="#05070a" opacity="0.35" style="transition: opacity 0.3s ease;" />
  </g>

  <!-- ================= 4. DETAYLAR (FARLAR, IZGARA, ÇITALAR, KAPI KOLLARI) ================= -->
  <g id="layer-vehicle-details" stroke="#0f172a" stroke-width="1.8" fill="none" stroke-linecap="round">
    <!-- Ön Far -->
    <path d="M 60 260 Q 95 240 140 245 L 135 270 Z" fill="#e2e8f0" opacity="0.9" />
    <path d="M 65 262 Q 95 248 130 252" stroke="#38bdf8" stroke-width="3" /> <!-- LED Gündüz Farı -->

    <!-- Arka Stop -->
    <path d="M 945 255 Q 920 245 885 248 L 890 270 Z" fill="#ef4444" opacity="0.95" />
    
    <!-- Kapı Açma Çizgileri & Boşlukları -->
    <path d="M 330 195 L 330 325" stroke="#334155" stroke-width="2" /> <!-- Ön Çamurluk Çizgisi -->
    <path d="M 535 195 L 530 330" stroke="#334155" stroke-width="2" /> <!-- B Sütunu Kapı Ayrımı -->
    <path d="M 720 205 L 720 325" stroke="#334155" stroke-width="2" /> <!-- Arka Kapı Çizgisi -->
    
    <!-- Kapı Kolları -->
    <rect x="360" y="215" width="36" height="8" rx="3" fill="#334155" />
    <rect x="560" y="215" width="36" height="8" rx="3" fill="#334155" />
    
    <!-- Yan Ayna -->
    <path d="M 285 185 Q 260 175 255 195 Q 275 205 295 195 Z" fill="#1e293b" />
    
    <!-- Alt Marşpiyel Çıtası -->
    <path d="M 315 328 L 705 328" stroke="#0f172a" stroke-width="4" />
  </g>

  <!-- ================= 5. DİNAMİK STICKER YERLEŞTİRME VE ÇİZİM ALANI ================= -->
  <!-- Fabric.js Canvas bu katmanın üzerine veya doğrudan araç üstüne monte edilir -->
  <g id="layer-sticker-workspace"></g>

  <!-- ================= 6. TEKERLEKLER VE JANTLAR ================= -->
  <g id="layer-wheels">
    <!-- Ön Tekerlek -->
    <circle cx="270" cy="300" r="50" fill="#090a0c" stroke="#1f242d" stroke-width="6" />
    <circle cx="270" cy="300" r="35" fill="url(#rim-gradient)" stroke="#222" stroke-width="2" />
    <circle cx="270" cy="300" r="14" fill="#111" />
    <!-- 5 Kollu Spor Jant Deseni -->
    <line x1="270" y1="268" x2="270" y2="332" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="240" y1="290" x2="300" y2="310" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="250" y1="325" x2="290" y2="275" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    
    <!-- Arka Tekerlek -->
    <circle cx="750" cy="300" r="50" fill="#090a0c" stroke="#1f242d" stroke-width="6" />
    <circle cx="750" cy="300" r="35" fill="url(#rim-gradient)" stroke="#222" stroke-width="2" />
    <circle cx="750" cy="300" r="14" fill="#111" />
    <!-- 5 Kollu Spor Jant Deseni -->
    <line x1="750" y1="268" x2="750" y2="332" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="720" y1="290" x2="780" y2="310" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="730" y1="325" x2="770" y2="275" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- ================= 7. EN ÜST GERÇEKÇİ KONTUR VE PANEL BOŞLUĞU OVERLAY ================= -->
  <g id="layer-top-overlay" style="pointer-events: none; mix-blend-mode: multiply;">
    <!-- Çamurluk Davlumbaz Gölgeleri -->
    <path d="M 215 300 A 55 55 0 0 1 325 300" stroke="#000000" stroke-width="5" fill="none" opacity="0.4" />
    <path d="M 695 300 A 55 55 0 0 1 805 300" stroke="#000000" stroke-width="5" fill="none" opacity="0.4" />
  </g>
</svg>